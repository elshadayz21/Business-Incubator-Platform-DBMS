# Render Blueprint — DxValley ICMS
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: dxvalley-icms
    runtime: node
    rootDir: Website
    buildCommand: npm install && cd admin-ui && npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dxvalley-db
          property: connectionString
      - key: BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: dxvalley-db
    databaseName: incubator_db
    user: incubator_user
    plan: free
